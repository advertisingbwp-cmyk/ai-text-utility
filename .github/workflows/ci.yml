name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Run Test Suite
        run: npm test

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ai-text-utility.vercel.app

      - name: Verify production routes and structured data
        run: npm run check:production
